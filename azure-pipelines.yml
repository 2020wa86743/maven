trigger:
- master

pool:
  name: agent1

steps:
- script: git clone https://github.com/2020wa86743/maven.git
  displayName: 'download'
- script: cd /home/agent1/myagent/_work/1/s;mvn package
  displayName: 'Continuous build'
- script: scp /home/agent1/myagent/_work/1/s/webapp/target/webapp.war qaserver@20.255.99.209:/var/lib/tomcat10/webapps/testapp.war
  displayName: 'Deployment'
- script: git clone https://github.com/2020wa86743/FunctionalTesting.git
  displayName: 'Continuous Testing'
- script: java -jar /home/agent1/myagent/_work/1/s/FunctionalTesting/testing.jar
  displayName: 'Run Selenium'
